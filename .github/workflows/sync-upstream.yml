name: Propose upstream sync

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout customized main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream
        run: |
          git remote add upstream https://github.com/kumatrk/initialrelease.git
          git fetch upstream main

      - name: Prepare review branch
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B upstream-sync origin/main

          if git merge-base --is-ancestor upstream/main origin/main; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Customized main already contains the current upstream main."
            exit 0
          fi

          if ! git merge upstream/main --no-edit; then
            git merge --abort || true
            echo "Upstream has merge conflicts with the customized fork. Manual review is required." >&2
            exit 1
          fi

          if git diff --quiet origin/main...HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          git push --force-with-lease origin upstream-sync

      - name: Open or update upstream review PR
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing_pr="$(gh pr list --head upstream-sync --base main --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing_pr" ]; then
            echo "Updated existing upstream review PR #${existing_pr}."
          else
            gh pr create \
              --head upstream-sync \
              --base main \
              --title "Review upstream Simple Kuma updates" \
              --body-file .github/upstream-sync-pr.md
          fi
