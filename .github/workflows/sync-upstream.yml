name: Propose upstream sync

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout customized main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream
        run: |
          git remote add upstream https://github.com/kumatrk/initialrelease.git
          git fetch upstream main

      - name: Prepare review branch
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B upstream-sync origin/main

          baseline="$(tr -d '[:space:]' < .github/upstream-base)"
          latest="$(git rev-parse upstream/main)"

          if [ "$baseline" = "$latest" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Customized main already contains the current upstream main."
            exit 0
          fi

          if ! git cat-file -e "${baseline}^{commit}"; then
            echo "Configured upstream baseline ${baseline} is unavailable." >&2
            exit 1
          fi

          git diff --binary "$baseline" "$latest" > "$RUNNER_TEMP/upstream.patch"
          if ! git apply --3way --index "$RUNNER_TEMP/upstream.patch"; then
            git reset --hard origin/main
            echo "Upstream file changes conflict with customized Kuma. Manual integration is required." >&2
            exit 1
          fi

          printf '%s\n' "$latest" > .github/upstream-base
          git add .github/upstream-base
          git commit -m "Propose upstream Kuma update ${baseline:0:8}..${latest:0:8}"

          echo "changed=true" >> "$GITHUB_OUTPUT"
          git push --force-with-lease origin upstream-sync

      - name: Open or update upstream review PR
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing_pr="$(gh pr list --head upstream-sync --base main --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing_pr" ]; then
            echo "Updated existing upstream review PR #${existing_pr}."
          else
            gh pr create \
              --head upstream-sync \
              --base main \
              --title "Review upstream Simple Kuma updates" \
              --body-file .github/upstream-sync-pr.md
          fi
